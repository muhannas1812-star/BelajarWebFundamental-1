    <title>Praktik Tabel</title>

    <h1>Praktik Tabel</h1>

    <h2>Table Kompleks</h2>

      <thead>
        <tr>
          <th></th>
          <th>Kolom 1</th>
          <th>Kolom 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Baris 1</th>
          <td>Baris 1, kolom 1</td>
          <td>Baris 1, kolom 2</td>
        </tr>
        <tr>
          <th>Baris 2</th>
          <td>Baris 2, kolom 1</td>
          <td>Baris 2, kolom 2</td>
        </tr>
      </tbody>
    </table>
  </body>
