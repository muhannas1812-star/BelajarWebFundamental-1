<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Select & Textarea</title>
  </head>
  <body>
    <form action="">
      <label for="kota">Pilih Kota Anda</label><br />
      <select name="kota" id="kota">
        <option value="">-- Pilih kota --</option>
        <option value="Jakarta">Jakarta</option>
        <option value="Manokwari">Manokwari</option>
        <option value="Kab. Teluk Wondama" selected>Kab. Teluk Wondama</option>
        <option value="Bintuni">Bintuni</option></select
      ><br /><br />

      <label for="pesan">Masukkan Pesan Anda</label>
      <br />
      <textarea
        name="pesan"
        id="pesan"
        rows="10"
        cols="70"
        placeholder="Ketik pesan disini..."
      >
saya adalah seorang mahasiswa di Universitas Papua</textarea
      >

      <br /><br /><button type="submit">Kirim</button>
    </form>
  </body>
</html>
